name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Junction.csproj references BulkForge (clemkd/BulkForge) as a sibling repo checkout — see the
      # comment on that ProjectReference. Check it out one level above this repo's own workspace, at
      # the exact relative path the .csproj expects (../../../BulkForge from src/Junction/).
      - name: Checkout BulkForge
        uses: actions/checkout@v4
        with:
          repository: Clemkd/BulkForge
          path: ../BulkForge

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test with coverage
        run: >
          dotnet test tests/Junction.Tests --no-build -c Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
